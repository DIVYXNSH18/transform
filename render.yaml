services:
  - type: web
    name: transformai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: rapidapi
      - key: RAPIDAPI_HOST
        value: open-ai21.p.rapidapi.com
      - key: RAPIDAPI_URL
        value: https://open-ai21.p.rapidapi.com/conversationllama
      - key: RAPIDAPI_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
